idth="0.005892857142857144"/></g><circle data-type="circle" data-label="" data-x="16.13" data-y="13.82" cx="127.81818181818198" cy="206.30303030303048" r="30.545454545454536" fill="#e6d4d4" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.93" data-y="12.219999999999999" cx="263.5757575757575" cy="477.818181818182" r="30.545454545454536" fill="#e6d4d4" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.93" data-y="13.02" cx="263.5757575757575" cy="342.060606060606" r="30.545454545454536" fill="#e6d4d4" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.93" data-y="13.82" cx="263.5757575757575" cy="206.30303030303048" r="30.545454545454536" fill="#e6d4d4" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="17.729999999999997" data-y="13.82" cx="399.33333333333303" cy="206.30303030303048" r="30.545454545454536" fill="#e6d4d4" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.5375" data-y="13.4925" cx="196.96969696969745" cy="261.878787878788" r="38.18181818181817" fill="#64748b" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.5375" data-y="13.4925" cx="196.96969696969745" cy="261.878787878788" r="16.969696969696965" fill="white" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="17.475" data-y="14.275000000000002" cx="356.06060606060646" cy="129.090909090909" r="38.18181818181817" fill="#64748b" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="17.475" data-y="14.275000000000002" cx="356.06060606060646" cy="129.090909090909" r="16.969696969696965" fill="white" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="17.461869681436248" data-y="11.788844630631196" cx="353.83243078918167" cy="550.9839414686455" r="38.18181818181817" fill="#64748b" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="17.461869681436248" data-y="11.788844630631196" cx="353.83243078918167" cy="550.9839414686455" r="16.969696969696965" fill="white" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.989765624999997" data-y="12.746171875" cx="273.71780303030255" cy="388.528409090909" r="38.18181818181817" fill="#2157a2" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.989765624999997" data-y="12.746171875" cx="273.71780303030255" cy="388.528409090909" r="16.969696969696965" fill="white" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.130000000000003" data-y="13.07" cx="127.81818181818244" cy="333.5757575757575" r="38.18181818181817" fill="#2157a2" stroke="black" stroke-width="0.005892857142857144"/><circle data-type="circle" data-label="" data-x="16.130000000000003" data-y="13.07" cx="127.81818181818244" cy="333.5757575757575" r="16.969696969696965" fill="white" stroke="black" stroke-width="0.005892857142857144"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":169.69696969696966,"c":0,"e":-2609.3939393939386,"b":0,"d":-169.69696969696966,"f":2551.515151515151};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
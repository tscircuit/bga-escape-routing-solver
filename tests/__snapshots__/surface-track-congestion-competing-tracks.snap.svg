7500000000000004 2.5000000000000004,0.8000000000000003" data-type="line" data-label="DATA0" points="564.3636363636364,232.18181818181816 564.3636363636364,227.09090909090907" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="10.181818181818182"/></g><g><polyline data-points="2.5000000000000004,0.8000000000000003 2.5,0.825" data-type="line" data-label="DATA0" points="564.3636363636364,227.09090909090907 564.3636363636364,224.54545454545456" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="10.181818181818182"/></g><g><polyline data-points="-2.5,0.825 -2.5,0.8000000000000003" data-type="line" data-label="DATA3" points="55.27272727272728,224.54545454545456 55.27272727272728,227.09090909090907" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="12.727272727272727"/></g><g><polyline data-points="-2.5,0.8000000000000003 -2.25,0.5500000000000003" data-type="line" data-label="DATA3" points="55.27272727272728,227.09090909090907 80.72727272727275,252.54545454545453" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="12.727272727272727"/></g><g><polyline data-points="-2.25,0.5500000000000003 1.1,0.5500000000000003" data-type="line" data-label="DATA3" points="80.72727272727275,252.54545454545453 421.8181818181818,252.54545454545453" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="12.727272727272727"/></g><g><polyline data-points="1.1,0.5500000000000003 2.5000000000000004,-0.8499999999999999" data-type="line" data-label="DATA3" points="421.8181818181818,252.54545454545453 564.3636363636364,395.0909090909091" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="12.727272727272727"/></g><g><polyline data-points="2.5000000000000004,-0.8499999999999999 2.5,-0.825" data-type="line" data-label="DATA3" points="564.3636363636364,395.0909090909091 564.3636363636364,392.54545454545456" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="12.727272727272727"/></g><circle data-type="circle" data-label="" data-x="-2.5" data-y="-0.825" cx="55.27272727272728" cy="392.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="2.5" data-y="0.825" cx="564.3636363636364" cy="224.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="-0.275" cx="55.27272727272728" cy="336.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="2.5" data-y="0.275" cx="564.3636363636364" cy="280.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="0.275" cx="55.27272727272728" cy="280.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="2.5" data-y="-0.275" cx="564.3636363636364" cy="336.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="0.825" cx="55.27272727272728" cy="224.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><circle data-type="circle" data-label="" data-x="2.5" data-y="-0.825" cx="564.3636363636364" cy="392.54545454545456" r="15.272727272727272" fill="#e6d4d4" stroke="black" stroke-width="0.009821428571428571"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":101.81818181818181,"c":0,"e":309.8181818181818,"b":0,"d":-101.81818181818181,"f":308.54545454545456};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
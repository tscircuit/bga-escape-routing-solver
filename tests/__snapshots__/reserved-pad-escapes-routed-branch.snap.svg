<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1.3,-0.65 1.3,-0.65" data-type="line" data-label="DATA" points="40,411.53846153846155 600,411.53846153846155" fill="none" stroke="#64748b" stroke-linejoin="round" stroke-width="27.353846153846156" stroke-dasharray="0.381 0.127"/></g><g><polyline data-points="-0.8,0 -1.05,0" data-type="line" data-label="CLOCK" points="147.69230769230768,271.53846153846155 93.84615384615384,271.53846153846155" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="27.353846153846156"/></g><g><polyline data-points="-1.05,0 -1.1,-0.04999999999999993" data-type="line" data-label="CLOCK" points="93.84615384615384,271.53846153846155 83.07692307692307,282.3076923076923" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="27.353846153846156"/></g><g><polyline data-points="-1.1,-0.04999999999999993 0.5000000000000002,-0.04999999999999993" data-type="line" data-label="CLOCK" points="83.07692307692307,282.3076923076923 427.69230769230774,282.3076923076923" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="27.353846153846156" stroke-dasharray="0.381 0.127"/></g><g><polyline data-points="0.5000000000000002,-0.04999999999999993 0.55,0" data-type="line" data-label="CLOCK" points="427.69230769230774,282.3076923076923 438.46153846153845,271.53846153846155" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="27.353846153846156"/></g><g><polyline data-points="0.55,0 0.8,0" data-type="line" data-label="CLOCK" points="438.46153846153845,271.53846153846155 492.3076923076923,271.53846153846155" fill="none" stroke="#2157a2" stroke-linejoin="round" stroke-width="27.353846153846156"/></g><circle data-type="circle" data-label="" data-x="-0.8" data-y="0" cx="147.69230769230768" cy="271.53846153846155" r="43.07692307692308" fill="#e6d4d4" stroke="black" stroke-width="0.004642857142857143"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0" cx="492.3076923076923" cy="271.53846153846155" r="43.07692307692308" fill="#e6d4d4" stroke="black" stroke-width="0.004642857142857143"/><circle data-type="circle" data-label="" data-x="-1.1" data-y="-0.04999999999999993" cx="83.07692307692307" cy="282.3076923076923" r="35.215384615384615" fill="#2157a2" stroke="black" stroke-width="0.004642857142857143"/><circle data-type="circle" data-label="" data-x="-1.1" data-y="-0.04999999999999993" cx="83.07692307692307" cy="282.3076923076923" r="21.53846153846154" fill="white" stroke="black" stroke-width="0.004642857142857143"/><circle data-type="circle" data-label="" data-x="0.5000000000000002" data-y="-0.04999999999999993" cx="427.69230769230774" cy="282.3076923076923" r="35.215384615384615" fill="#2157a2" stroke="black" stroke-width="0.004642857142857143"/><circle data-type="circle" data-label="" data-x="0.5000000000000002" data-y="-0.04999999999999993" cx="427.69230769230774" cy="282.3076923076923" r="21.53846153846154" fill="white" stroke="black" stroke-width="0.004642857142857143"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":215.3846153846154,"c":0,"e":320,"b":0,"d":-215.3846153846154,"f":271.53846153846155};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>